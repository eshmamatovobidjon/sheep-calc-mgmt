[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepbot"
version = "0.1.0"
description = "Telegram bot for sheep-meat trip accounting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3",
    "fastapi",
    "uvicorn",
    "SQLAlchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "openpyxl",
    "reportlab",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sheepbot = ["reports/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
